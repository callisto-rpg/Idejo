# SPDX-License-Identifier: AGPL-3.0-only
#
# Publishes the official Docker image (AD-01) when a release tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match `version` in mix.exs. The M6 exit check runs first; the image is pushed
# to ghcr.io/callisto-rpg/idejo as `X.Y.Z` and `X.Y` only once it passes. Idejo Hub starts
# forums from these images and pins each one to an exact version.
# The image is built from the tagged commit with .git/HEAD in the build context, so its
# "Source code" link points at that commit (LI-03).

name: Publish image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches mix.exs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with mix.exs
        run: |
          version=$(sed -n 's/^ *version: "\([^"]*\)",$/\1/p' mix.exs | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mix.exs version $version"
            exit 1
          fi

  m6:
    name: M6 exit check
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: deploy/test/m6/run.sh --skip-flow

  publish:
    name: Build and push
    needs: m6
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/idejo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Idejo
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          # The local checkout, not the git URL, so .git/HEAD reaches the build (LI-03).
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
