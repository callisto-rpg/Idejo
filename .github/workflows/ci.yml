#
# CI (DV-02, DV-03, DV-06, LI-01). Every job must pass before a merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  licence-headers:
    name: SPDX headers (REUSE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  checks:
    name: Format, lint, security, audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-checks-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix sobelow --config --exit
      - run: mix deps.audit
      - run: mix hex.audit
      - run: mix deps.unlock --check-unused

  dialyzer:
    name: Type checks (Dialyzer)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-dialyzer-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer --format github

  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
      - run: mix deps.get
      - run: mix test --warnings-as-errors

  # Added in M2–M3: end-to-end flows (MVP §4) with Playwright + axe accessibility checks.
  # Added in M5: k6 load test (NF-01, NF-04) on release branches.
