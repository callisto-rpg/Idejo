#
# AD-16: run idejo behind your own reverse proxy, without the bundled Caddy. Given after the
# main file, it changes only this:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.external-proxy.yml \
#     --env-file deploy/.env up -d --build
#
# - Caddy is not started (it only runs with the "bundled-proxy" profile, which nothing asks
#   for); its ports 80 and 443 stay free for your proxy.
# - The app is published on IDEJO_BIND:IDEJO_PORT (127.0.0.1:4000 by default: a proxy on the
#   same machine). Your proxy must terminate TLS and send X-Forwarded-For,
#   X-Forwarded-Proto and X-Forwarded-Host; see docs/deploying.md, "Running behind your own
#   reverse proxy", and IDEJO_TRUSTED_PROXIES in .env.example.

services:
  caddy:
    profiles: ["bundled-proxy"]

  app:
    ports:
      - "${IDEJO_BIND:-127.0.0.1}:${IDEJO_PORT:-4000}:4000"
