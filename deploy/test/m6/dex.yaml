#
# M6 exit check: the test OpenID Connect provider (Dex, Apache-2.0), served by Caddy as
# https://id.idejo.test. One member, one client per forum. Test values only.

issuer: https://id.idejo.test

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

staticClients:
  - id: forum-a
    name: Forum A
    secretEnv: FORUM_A_OIDC_SECRET
    redirectURIs:
      - https://a.idejo.test/users/oidc/callback
  - id: forum-b
    name: Forum B
    secretEnv: FORUM_B_OIDC_SECRET
    redirectURIs:
      - https://b.idejo.test/users/oidc/callback

staticPasswords:
  # Password: "m6 exit check member" (bcrypt, from `caddy hash-password`).
  - email: member@idejo.test
    hash: "$2a$14$OvFYNsParC6kghMoinTWQOQGNwMjE3fU5c1eCIZ0oVDM7/4X0aVi."
    username: m6member
    userID: 6b0a3f2e-0c1d-4e7b-9a55-6d0e2f1a9c01
