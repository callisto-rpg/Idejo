#
# Production bundle (AD-01): app + PostgreSQL + Caddy with automatic HTTPS.
#
#   cp deploy/.env.example deploy/.env    # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# The app image is built from the Dockerfile at the repository root, generated by
# `mix phx.gen.release --docker` (it pins the Elixir/Erlang/Debian base images).

name: idejo

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Run pending migrations, then start the server (both scripts come from phx.gen.release).
    command: ["sh", "-c", "/app/bin/migrate && /app/bin/server"]
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${IDEJO_DOMAIN}
      IDEJO_SOURCE_URL: ${IDEJO_SOURCE_URL:-}
      PORT: "4000"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: ecto://idejo:${POSTGRES_PASSWORD}@db/idejo
      IDEJO_UPLOADS_DIR: /data/uploads
      IDEJO_BACKUP_DIR: /data/backups
    volumes:
      - uploads:/data/uploads   # TP-12: images on local disk
      - backups:/data/backups   # AD-05: nightly backups on local disk
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: idejo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: idejo
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idejo -d idejo"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      IDEJO_DOMAIN: ${IDEJO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates — keep this volume
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
