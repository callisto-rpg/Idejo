#
# Local development services. Start with: docker compose up -d
# The app itself runs on your machine with `mix phx.server`.
# Credentials match the defaults in config/dev.exs and config/test.exs from `mix phx.new`.
# The production bundle (app + PostgreSQL + Caddy) lives in deploy/.

name: idejo-dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
