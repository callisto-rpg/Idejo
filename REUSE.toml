version = 1
SPDX-PackageName = "Idejo"
SPDX-PackageSupplier = "Mariano Pictet"
SPDX-PackageDownloadLocation = "https://idejo.org"

# Files that cannot carry an SPDX comment header (LI-01).
[[annotations]]
path = [
  "**/*.md",
  "**/*.pdf",
  "NOTICE",
  ".sobelow-conf",
  ".tool-versions",
  ".gitattributes",
  ".gitignore",
  "mix.lock",
  "REUSE.toml",
  "**/*.json",
  "**/*.pot",
  "**/*.po",
  "priv/static/**",
  "assets/vendor/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mariano Pictet and contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# TP-17: emoji. Later annotations override the general ones above.
[[annotations]]
path = "priv/static/emoji/**"
precedence = "override"
SPDX-FileCopyrightText = ["2014-2021 Twitter, Inc and other contributors", "2022-present Jason Sofonia & Justine De Caires"]
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "priv/static/reactions/**"
precedence = "override"
SPDX-FileCopyrightText = "Mariano Pictet"
SPDX-License-Identifier = "CC-BY-4.0"

# The Idejo logos (steward decision, 2026-10-23).
[[annotations]]
path = ["priv/static/images/logo*", "priv/static/favicon.ico"]
precedence = "override"
SPDX-FileCopyrightText = "Mariano Pictet"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "priv/emoji/emoji.json"
precedence = "override"
SPDX-FileCopyrightText = ["2014 Titus Wormer", "2026 Mariano Pictet and contributors"]
SPDX-License-Identifier = "MIT"

# Fonts (steward decision, 2026-10-23), from Fontsource 5.3.0 (Google Fonts builds).
[[annotations]]
path = "priv/static/fonts/fraunces-*"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Fraunces Project Authors (github.com/undercasetype/Fraunces)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "priv/static/fonts/rubik-*"
precedence = "override"
SPDX-FileCopyrightText = "2015 The Rubik Project Authors (github.com/googlefonts/rubik)"
SPDX-License-Identifier = "OFL-1.1"
